<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="emu-chat">
  <title>emu-chat</title>
  <defs>
    <!-- 底座:深邃石板渐变(冷灰蓝) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c212c"/>
      <stop offset="0.55" stop-color="#151921"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="ambient" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.12"/>
    </linearGradient>

    <!-- 气泡内部:深翡翠青色玻璃,与冷灰蓝底座形成色相区分 -->
    <linearGradient id="bubbleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17494a"/>
      <stop offset="0.55" stop-color="#0f3538"/>
      <stop offset="1" stop-color="#0a2427"/>
    </linearGradient>

    <!-- 气泡内部底光 -->
    <radialGradient id="bubbleGlow" cx="0.5" cy="1" r="0.85">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>

    <!-- 气泡描边:翡翠渐变 -->
    <linearGradient id="emeraldBorder" gradientUnits="userSpaceOnUse" x1="72" y1="424" x2="440" y2="96">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>

    <!-- 字标渐变:整体提亮,保证在青色气泡上对比清晰 -->
    <linearGradient id="emerald" gradientUnits="userSpaceOnUse" x1="78" y1="340" x2="432" y2="180">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>

    <!-- 气泡顶部高光 -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glowBig" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!-- 对话气泡轮廓(左下尾巴) -->
    <path id="bubble" d="M156 96H356A84 84 0 0 1 440 180V284A84 84 0 0 1 356 368H244L150 424L156 368A84 84 0 0 1 72 284V180A84 84 0 0 1 156 96Z"/>

    <!-- 字标 emu:m 与 u 共用中间竖笔的连字 -->
    <g id="wordmark" fill="none" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M90 262H202A56 56 0 1 0 188.9 298"/>
      <path d="M246 318V235A29 29 0 0 1 304 235V318"/>
      <path d="M304 235A29 29 0 0 1 362 235V289"/>
      <path d="M362 235V289A29 29 0 0 0 420 289V235"/>
    </g>
  </defs>

  <!-- 圆角方形底座 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#ambient)"/>
  <rect x="0.5" y="0.5" width="511" height="511" rx="111.5" fill="none" stroke="url(#rim)" stroke-width="1"/>

  <!-- 气泡外层光晕 -->
  <use href="#bubble" fill="none" stroke="#14b8a6" stroke-width="10" opacity="0.55" filter="url(#glowBig)"/>

  <!-- 气泡本体:深翡翠玻璃 + 内部底光 + 顶部高光 -->
  <use href="#bubble" fill="url(#bubbleFill)"/>
  <use href="#bubble" fill="url(#bubbleGlow)"/>
  <use href="#bubble" fill="url(#sheen)"/>

  <!-- 气泡翡翠描边 -->
  <use href="#bubble" fill="none" stroke="url(#emeraldBorder)" stroke-width="5" stroke-linejoin="round"/>

  <!-- 气泡内的 emu 字标 -->
  <g transform="translate(256 232) scale(0.68) translate(-255 -261)">
    <use href="#wordmark" stroke="#2dd4bf" opacity="0.5" filter="url(#glow)"/>
    <use href="#wordmark" stroke="url(#emerald)"/>

    <!-- Agent 脉冲节点 -->
    <circle cx="420" cy="206" r="26" fill="#5eead4" opacity="0.28" filter="url(#glow)"/>
    <circle cx="420" cy="206" r="15" fill="#0a2427"/>
    <circle cx="420" cy="206" r="9" fill="#99f6e4"/>
    <circle cx="417" cy="203" r="3" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>